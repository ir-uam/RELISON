<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Edges and handle adapt to the browser's light/dark tab chrome. -->
  <style>
    .ink { stroke: #2b2b2b; }
    @media (prefers-color-scheme: dark) { .ink { stroke: #e9e9e9; } }
  </style>

  <!-- Magnifying-glass handle -->
  <line class="ink" x1="40" y1="40" x2="60" y2="60" stroke-width="7" stroke-linecap="round"/>

  <!-- Lens -->
  <circle cx="26" cy="26" r="22" fill="#cfe0f7" stroke="#3f7fe0" stroke-width="4"/>

  <!-- Network edges inside the lens -->
  <g class="ink" stroke-width="1.2" opacity="0.65">
    <line x1="16" y1="18" x2="34" y2="16"/>
    <line x1="16" y1="18" x2="22" y2="34"/>
    <line x1="34" y1="16" x2="36" y2="30"/>
    <line x1="22" y1="34" x2="36" y2="30"/>
    <line x1="16" y1="18" x2="36" y2="30"/>
    <line x1="26" y1="12" x2="34" y2="16"/>
  </g>

  <!-- Nodes -->
  <g stroke="#222" stroke-width="1">
    <circle cx="16" cy="18" r="5" fill="#b01515"/>
    <circle cx="22" cy="34" r="5" fill="#b01515"/>
    <circle cx="36" cy="30" r="4" fill="#f08a3c"/>
    <circle cx="34" cy="16" r="3.5" fill="#f7efd8"/>
    <circle cx="26" cy="12" r="3" fill="#f7efd8"/>
    <circle cx="14" cy="28" r="3" fill="#f7efd8"/>
    <circle cx="30" cy="39" r="3" fill="#f7efd8"/>
  </g>
</svg>
